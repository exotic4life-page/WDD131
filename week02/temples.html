<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temple Album for WDD 131 featuring a responsive collection of temples from around the world.">
    <meta name="author" content="Chidiebere Agbo">
    <title>Temple Album | WDD 131</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <div class="site-header">
            <a class="site-title" href="temples.html">Temple Album</a>
            <button id="menu-button" class="menu-button" type="button"
                aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-nav">
                <span class="hamburger" aria-hidden="true">☰</span>
            </button>
        </div>
        <nav id="primary-nav" class="navigation" aria-label="Primary navigation">
            <a href="#home">Home</a>
            <a href="#old">Old</a>
            <a href="#new">New</a>
            <a href="#large">Large</a>
            <a href="#small">Small</a>
        </nav>
    </header>

    <main id="home">
        <h1>Temple Album</h1>

        <section class="temple-grid" aria-label="Temple photo album">
            <figure id="old">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Salt%20Lake%20Temple.jpg?width=900"
                    alt="Salt Lake Utah Temple" width="900" height="675" loading="lazy">
                <figcaption>Salt Lake Utah Temple</figcaption>
            </figure>

            <figure id="new">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Aba%20Nigeria%20Temple.jpg?width=900"
                    alt="Aba Nigeria Temple" width="900" height="600" loading="lazy">
                <figcaption>Aba Nigeria Temple</figcaption>
            </figure>

            <figure id="large">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Provo%20Utah%20Temple.jpg?width=900"
                    alt="Provo Utah Temple" width="900" height="675" loading="lazy">
                <figcaption>Provo Utah Temple</figcaption>
            </figure>

            <figure id="small">
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cedar%20City%20Utah%20Temple.jpg?width=900"
                    alt="Cedar City Utah Temple" width="900" height="600" loading="lazy">
                <figcaption>Cedar City Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Draper%20LDS%20Temple.jpg?width=900"
                    alt="Draper Utah Temple" width="900" height="600" loading="lazy">
                <figcaption>Draper Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Payson%20Utah%20Temple%20%2835890361685%29.jpg?width=900"
                    alt="Payson Utah Temple" width="900" height="600" loading="lazy">
                <figcaption>Payson Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Oquirrh%20Mountain%20front%20view.jpg?width=900"
                    alt="Oquirrh Mountain Utah Temple" width="900" height="600" loading="lazy">
                <figcaption>Oquirrh Mountain Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Red%20Cliffs%20DSC6409%201280px.jpg?width=900"
                    alt="Red Cliffs Utah Temple" width="900" height="600" loading="lazy">
                <figcaption>Red Cliffs Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="https://commons.wikimedia.org/wiki/Special:FilePath/Dallas%20LDS%20Temple%20by%20David%20B.jpeg?width=900"
                    alt="Dallas Texas Temple" width="900" height="600" loading="lazy">
                <figcaption>Dallas Texas Temple</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Chidiebere Agbo</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
